[project]
name = "tts-server"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.110.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "piper-tts>=1.4.2",
    "onnxruntime>=1.16.0",
    "TTS>=0.22.0",
    "torch>=2.1.0",
    "numpy>=1.26.4",
    "soundfile>=0.12.1",
    "pydub>=0.25.1",
    "httpx>=0.27.0",
    "diskcache>=5.6.3",
]

[tool.fastapi]
entrypoint = "app.main:app"
